    <style id="responsive-fix">
/* Evita desbordamiento horizontal */
html, body {
  max-width: 100%;
  overflow-x: hidden;
  box-sizing: border-box;
}
*, *::before, *::after {

}

#root {

  display: flex;
  flex-direction: column;
  width: 100%;
  overflow-x: hidden;
}

/* Inputs y botones táctiles */
input, select, textarea, button {

  min-height: 44px;
}

/* Evitar desbordes de texto largo */
h1, h2, h3, h4, p {
  overflow-wrap: break-word;
}
